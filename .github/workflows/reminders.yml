name: Fire reminders

# Drives the reminder scheduler from outside the API, so the server itself
# doesn't need to stay awake. The same request also wakes a sleeping free-tier
# instance, which is why this doubles as a keep-alive.
#
# Setup: add two repository secrets (Settings -> Secrets and variables ->
# Actions):
#   API_URL      e.g. https://baby-tracker-api.onrender.com
#   CRON_SECRET  the same value as the API's CRON_SECRET env var
#
# Note on cost: GitHub bills each run as a whole minute. Public repos are free
# and unlimited. On a PRIVATE repo the 2,000 free minutes/month works out to
# roughly one run every 30 minutes — going more often than that will start
# consuming paid minutes, so use cron-job.org or Supabase pg_cron instead if you
# want finer granularity on a private repo.

on:
  schedule:
    # Every 30 minutes. GitHub's scheduler is best-effort and can run several
    # minutes late; reminders are interval-based so a little drift is harmless.
    - cron: "*/30 * * * *"
  workflow_dispatch: # lets you trigger a run by hand to test

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /internal/reminders/tick
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL and CRON_SECRET repository secrets must both be set."
            exit 1
          fi

          # A sleeping free-tier instance can take ~60s to wake, so allow a
          # generous timeout and one retry before calling it a failure.
          for attempt in 1 2; do
            response=$(curl -sS --max-time 120 -w "\n%{http_code}" \
              -X POST "$API_URL/internal/reminders/tick" \
              -H "x-cron-secret: $CRON_SECRET") && break
            echo "attempt $attempt failed, retrying..."
            sleep 15
          done

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)
          echo "HTTP $status - $body"

          if [ "$status" != "200" ]; then
            echo "Reminder tick failed."
            exit 1
          fi
